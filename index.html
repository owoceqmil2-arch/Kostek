<!doctype html>
<html>
<head>
  <title>Ptoszek Mod</title>
  <meta charset='UTF-8'>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: sans-serif;
      overflow: hidden;
      background-color: #f0f0f0;
    }
    .hello-message {
      margin: 40px;
      text-align: center;
    }
    img {
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class='hello-message'>
    <h1>Siemano kolano!</h1>
    <h2>We no walnij 3 razy w spacje.</h2>
    <h3>(albo kliknij w obrazek)</h3>

    <img id="ptokBtn" src='bartekk.JPG' alt='Kliknij mnie' style="cursor:pointer;" />
  </div>

  <script>
    const mojeMultimedia = [
      'bartekk.JPG',
      'cwel.JPG'
    ];

    let spaceCount = 0;

    function uruchomAtak() {
      alert("Zostałeś strollowany!");
      
      mojeMultimedia.forEach((link) => {
        let szerokosc = Math.floor(Math.random() * 400) + 300;
        let wysokosc = Math.floor(Math.random() * 400) + 300;
        let x = Math.floor(Math.random() * window.screen.width);
        let y = Math.floor(Math.random() * window.screen.height);
        
        window.open(link, '_blank', `width=${szerokosc},height=${wysokosc},left=${x},top=${y}`);
      });
    }

    document.getElementById('ptokBtn').addEventListener('click', () => {
      uruchomAtak();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        spaceCount++;
        if (spaceCount >= 3) {
          uruchomAtak();
          spaceCount = 0;
        }
      }
    });
  </script>   

</body>
</html>
